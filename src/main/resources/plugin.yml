main: reyd.CombatMain
name: CombatAWM
version: 2.0.0
api: ["1.0.14"]
author: BrunoJaegerK
description: Combat tagging and combat-log protection for Nukkit PetteriM1 Edition
commands:
  combat:
    description: View combat status, toggle PvP, or reload CombatAWM
    usage: "/combat <status|toggle|reload>"
    permission: combatawm.command
permissions:
  combatawm.command:
    default: true
  combatawm.admin:
    default: op
