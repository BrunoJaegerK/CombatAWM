name: Build CombatAWM

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CombatAWM
        uses: actions/checkout@v4
      - name: Checkout Nukkit PetteriM1 Edition API
        uses: actions/checkout@v4
        with:
          repository: BrunoJaegerK/NukkitPetteriM1Edition
          ref: release
          path: nukkit-server
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install Nukkit PM1E to local Maven repository
        run: mvn --batch-mode --no-transfer-progress -f nukkit-server/pom.xml -DskipTests -Dmaven.test.skip=true install
      - name: Build CombatAWM
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: CombatAWM
          path: target/CombatAWM.jar
          if-no-files-found: error
          retention-days: 14
